<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | Sidratul Muntaha</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="section">
      <h1>About Me</h1>
      <div class="about-card">
        <img class="about-avatar" id="about-avatar-img" src="images/avatar.svg" alt="Avatar" />
        <div>
          <h2 id="about-name"></h2>
          <p class="hero-role" id="about-role"></p>
          <p id="about-bio"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>What I'm Learning</h2>
      <div class="timeline">
        <div class="timeline-item">
          <h3>Foundations</h3>
          <p>C, C++, and Python — the languages I learned first.</p>
        </div>
        <div class="timeline-item">
          <h3>Currently Exploring</h3>
          <p>Web development (HTML, CSS, JS) and computer networking.</p>
        </div>
        <div class="timeline-item">
          <h3>Creative Side</h3>
          <p>Writing, photography, videography, and gaming.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Certificates</h2>
      <div class="cert-grid" id="certificates"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="data/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
